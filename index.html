<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CATÁLOGO UFINET</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f5f7fa;
padding:20px;
}

h1{
text-align:center;
color:#003366;
margin-bottom:25px;
}

.filtros{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

input,select{
padding:12px;
border-radius:8px;
border:1px solid #ccc;
font-size:15px;
}

#buscar{
flex:1;
min-width:250px;
}

.contador{
font-size:18px;
font-weight:bold;
margin-bottom:20px;
}

#productos{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.10);
transition:.2s;
}

.card:hover{
transform:translateY(-3px);
}

.info{
padding:15px;
}

.tipo{
display:inline-block;
background:#003366;
color:white;
padding:4px 10px;
border-radius:6px;
font-size:12px;
margin-bottom:10px;
}

.nombre{
font-size:18px;
font-weight:bold;
margin-bottom:8px;
}

.codigo{
color:#666;
font-size:13px;
margin-bottom:5px;
}

.marca{
color:#0078D4;
font-weight:bold;
margin-bottom:10px;
}

.precio{
font-size:24px;
font-weight:bold;
color:#11823b;
}

.paginacion{
margin-top:30px;
display:flex;
justify-content:center;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

button{
padding:10px 15px;
border:none;
border-radius:8px;
background:#003366;
color:white;
cursor:pointer;
}

button:hover{
background:#0055aa;
}

button:disabled{
background:#cccccc;
cursor:not-allowed;
}

#paginaActual{
font-weight:bold;
}

</style>
</head>
<body>

<h1>CATÁLOGO UFINET</h1>

<div class="filtros">

<input
id="buscar"
type="text"
placeholder="Buscar producto o código">

<select id="tipo">
<option value="">Todos</option>
<option value="Equipo">Equipo</option>
<option value="Material">Material</option>
</select>

<select id="marca">
<option value="">Todas las marcas</option>
</select>

</div>

<div id="contador" class="contador">
Cargando catálogo...
</div>

<div id="productos"></div>

<div class="paginacion">

<button id="anterior">
◀ Anterior
</button>

<span id="paginaActual">
Página 1
</span>

<button id="siguiente">
Siguiente ▶
</button>

</div>

<script>

let productos = [];
let productosFiltrados = [];

let pagina = 1;
const porPagina = 50;

async function cargarProductos(){

try{

const respuesta =
await fetch("./productos.json");

productos =
await respuesta.json();

productosFiltrados = productos;

llenarMarcas();
mostrar();

}
catch(error){

document.getElementById("contador").innerHTML =
"Error cargando catálogo";

console.error(error);

}

}

function llenarMarcas(){

const marcas =
[...new Set(productos.map(x => x.MARCA))]
.sort();

const combo =
document.getElementById("marca");

marcas.forEach(m=>{

const op =
document.createElement("option");

op.value = m;
op.textContent = m;

combo.appendChild(op);

});

}

function mostrar(){

const inicio =
(pagina - 1) * porPagina;

const fin =
inicio + porPagina;

const datos =
productosFiltrados.slice(inicio, fin);

document.getElementById("contador").innerHTML =
productosFiltrados.length.toLocaleString("es-ES")
+ " productos encontrados";

let html = "";

datos.forEach(p=>{

html += `
<div class="card">
<div class="info">

<div class="tipo">
${p.TIPO}
</div>

<div class="nombre">
${p.DESCRIPCION}
</div>

<div class="codigo">
Código: ${p.PERSONALIZADO}
</div>

<div class="marca">
${p.MARCA}
</div>

<div class="precio">
${p.PRECIO}
</div>

</div>
</div>
`;

});

document.getElementById("productos").innerHTML =
html;

const totalPaginas =
Math.ceil(
productosFiltrados.length /
porPagina
);

document.getElementById("paginaActual").innerHTML =
`Página ${pagina} de ${totalPaginas}`;

document.getElementById("anterior").disabled =
pagina === 1;

document.getElementById("siguiente").disabled =
pagina === totalPaginas;

}

function filtrar(){

const texto =
document
.getElementById("buscar")
.value
.toLowerCase();

const tipo =
document
.getElementById("tipo")
.value;

const marca =
document
.getElementById("marca")
.value;

productosFiltrados =
productos.filter(p=>{

return (

(
p.DESCRIPCION.toLowerCase().includes(texto)
||
p.PERSONALIZADO.includes(texto)
)

&&

(tipo === "" || p.TIPO === tipo)

&&

(marca === "" || p.MARCA === marca)

);

});

pagina = 1;

mostrar();

}

document
.getElementById("buscar")
.addEventListener("input",filtrar);

document
.getElementById("tipo")
.addEventListener("change",filtrar);

document
.getElementById("marca")
.addEventListener("change",filtrar);

document
.getElementById("anterior")
.addEventListener("click",()=>{

if(pagina>1){

pagina--;
mostrar();

}

});

document
.getElementById("siguiente")
.addEventListener("click",()=>{

const total =
Math.ceil(
productosFiltrados.length /
porPagina
);

if(pagina<total){

pagina++;
mostrar();

}

});

cargarProductos();

</script>

</body>
</html>
