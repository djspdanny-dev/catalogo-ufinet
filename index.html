<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Ufinet</title>

<style>

body{
font-family:Arial,sans-serif;
margin:0;
padding:20px;
background:#f5f5f5;
}

h1{
text-align:center;
color:#003366;
}

.filtros{
display:flex;
gap:10px;
margin:20px 0;
flex-wrap:wrap;
}

input,select{
padding:10px;
border:1px solid #ccc;
border-radius:8px;
}

#buscar{
flex:1;
}

.productos{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card-content{
padding:15px;
}

.codigo{
color:#666;
font-size:12px;
}

.precio{
color:green;
font-weight:bold;
font-size:18px;
margin-top:10px;
}

.tipo{
background:#003366;
color:white;
padding:3px 8px;
border-radius:5px;
display:inline-block;
font-size:12px;
margin-bottom:10px;
}

</style>

</head>
<body>

<h1>CATÁLOGO UFINET</h1>

<div class="filtros">

<input
type="text"
id="buscar"
placeholder="Buscar producto...">

<select id="tipo">
<option value="">Todos</option>
<option value="Equipo">Equipo</option>
<option value="Material">Material</option>
</select>

</div>

<div id="productos" class="productos"></div>

<script>

const productos = [

{
codigo:"2987",
marca:"Carritech",
descripcion:"GLC-BX-D-20",
precio:"5.23",
tipo:"Equipo",
imagen:"https://picsum.photos/400/300?1"
},

{
codigo:"6996",
marca:"Hioki",
descripcion:"BT3554-52",
precio:"4800",
tipo:"Equipo",
imagen:"https://picsum.photos/400/300?2"
},

{
codigo:"1639",
marca:"Genérica",
descripcion:"Bandeja metálica para rack 19",
precio:"17.55",
tipo:"Material",
imagen:"https://picsum.photos/400/300?3"
}

];

const contenedor =
document.getElementById("productos");

function renderizar(lista){

contenedor.innerHTML="";

lista.forEach(p=>{

contenedor.innerHTML += `

<div class="card">

<img src="${p.imagen}">

<div class="card-content">

<div class="tipo">${p.tipo}</div>

<h3>${p.descripcion}</h3>

<p class="codigo">
Código: ${p.codigo}
</p>

<p>
Marca: ${p.marca}
</p>

<p class="precio">
$ ${p.precio}
</p>

</div>

</div>

`;

});

}

renderizar(productos);

function filtrar(){

const texto=
document.getElementById("buscar")
.value
.toLowerCase();

const tipo=
document.getElementById("tipo")
.value;

const resultado=
productos.filter(p=>{

return (
(p.descripcion.toLowerCase().includes(texto) ||
p.codigo.includes(texto)) &&
(tipo==="" || p.tipo===tipo)
);

});

renderizar(resultado);

}

document.getElementById("buscar")
.addEventListener("input",filtrar);

document.getElementById("tipo")
.addEventListener("change",filtrar);

</script>

</body>
</html>
