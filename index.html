<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba JSON</title>
</head>

<body>

<h1>Catálogo Ufinet</h1>

<div id="resultado">Cargando...</div>

<script>

fetch('./productos.json')
.then(response => response.json())
.then(data => {

document.getElementById('resultado').innerHTML =

'Productos encontrados: ' + data.length +

'<br><br>' +

data.map(x =>
x.DESCRIPCION +
' - ' +
x.MARCA
).join('<br>');

})
.catch(error => {

document.getElementById('resultado').innerHTML =
'ERROR: ' + error;

console.error(error);

});

</script>

</body>
</html>
