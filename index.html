<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CATÁLOGO UFINET</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, Arial, sans-serif;
}

body{
background:#f4f6f9;
padding:20px;
}

h1{
text-align:center;
color:#003366;
margin-bottom:25px;
}

.filtros{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

input,select{
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

#buscar{
flex:1;
min-width:250px;
}

#productos{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
overflow:hidden;
}

.info{
padding:15px;
}

.tipo{
display:inline-block;
background:#003366;
color:white;
padding:4px 10px;
border-radius:5px;
font-size:12px;
margin-bottom:10px;
}

.nombre{
font-size:18px;
font-weight:bold;
margin-bottom:6px;
}

.marca{
color:#0078d4;
font-weight:bold;
margin-bottom:6px;
}

.codigo{
font-size:13px;
color:#666;
}

.precio{
margin-top:10px;
font-size:22px;
font-weight:bold;
color:green;
}

.contador{
margin-bottom:15px;
font-weight:bold;
}

</style>
</head>

<body>

<h1>CATÁLOGO UFINET</h1>

<div class="filtros">

<input
id="buscar"
type="text"
placeholder="Buscar por descripción o código">

<select id="tipo">
<option value="">Todos</option>
<option value="Equipo">Equipo</option>
<option value="Material">Material</option>
</select>

<select id="marca">
<option value="">Todas las marcas</option>
</select>

</div>

<div id="contador" class="contador">
Cargando productos...
</div>

<div id="productos"></div>

<script>

let productos=[];

async function cargarDatos(){

const respuesta =
await fetch('productos.json');

productos =
await respuesta.json();

cargarMarcas();

mostrar(productos);

}

function cargarMarcas(){

const marcas =
[...new Set(productos.map(x=>x.MARCA))]
.sort();

const select =
document.getElementById("marca");

marcas.forEach(m=>{

const op =
document.createElement("option");

op.value=m;
op.textContent=m;

select.appendChild(op);

});

}
