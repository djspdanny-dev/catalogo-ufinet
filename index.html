<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CATALOGO UFINET 2.0</title><style>:root{--bg:#f5f7fa;--card:#fff;--text:#222;--pri:#003366}body.dark{--bg:#121212;--card:#1e1e1e;--text:#f2f2f2}*{box-sizing:border-box;font-family:Segoe UI,sans-serif}body{margin:0;background:var(--bg);color:var(--text);padding:20px}h1{text-align:center}.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.top input,.top select,.top button{padding:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:15px}.card{background:var(--card);border-radius:10px;padding:12px;box-shadow:0 2px 6px rgba(0,0,0,.15)}.imgbox{height:140px;background:#ddd;display:flex;align-items:center;justify-content:center;border-radius:8px;overflow:hidden}.imgbox img{max-width:100%;max-height:100%}.fav{cursor:pointer;font-size:22px;float:right}.btn{background:var(--pri);color:#fff;border:none;border-radius:6px;cursor:pointer;padding:8px 10px;margin:2px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7)}.content{background:var(--card);color:var(--text);max-width:700px;margin:4% auto;padding:20px;border-radius:10px}.pagination{text-align:center;margin-top:15px}</style></head><body><h1>CATÁLOGO UFINET 2.0</h1><div class=top><input id=buscar placeholder='Buscar código o descripción'><select id=soloFav><option value='no'>Todos</option><option value='si'>⭐ Favoritos</option></select><button id=theme>🌙 Tema</button><span id=cnt></span></div><div id=productos class=grid></div><div class=pagination><button class=btn id=prev>◀</button><span id=pag></span><button class=btn id=next>▶</button></div><div id=modal class=modal><div class=content><div id=detalle></div><button class=btn onclick='cerrarModal()'>Cerrar</button></div></div><script>let productos=[],fil=[],pag=1;const por=50;const favs=JSON.parse(localStorage.getItem('favs')||'[]');fetch('./productos.json').then(r=>r.json()).then(d=>{productos=d;fil=d;render();});document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('theme',document.body.classList.contains('dark'));};if(localStorage.getItem('theme')==='true')document.body.classList.add('dark');function esFav(c){return favs.includes(c)}function toggleFav(c){let i=favs.indexOf(c);if(i>=0)favs.splice(i,1);else favs.push(c);localStorage.setItem('favs',JSON.stringify(favs));render();}function copiar(c){navigator.clipboard.writeText(c);alert('Código copiado: '+c)}function detalle(p){document.getElementById('detalle').innerHTML=`<h2>${p.DESCRIPCION}</h2><p><b>Código:</b> ${p.PERSONALIZADO}</p><p><b>Marca:</b> ${p.MARCA}</p><p><b>Tipo:</b> ${p.TIPO}</p><p><b>Precio:</b> ${p.PRECIO}</p><div class='imgbox'><img src='imagenes/${p.PERSONALIZADO}.jpg' onerror='this.style.display="none";this.parentNode.innerHTML="📷 Imagen no disponible"'></div><button class='btn' onclick='copiar("${p.PERSONALIZADO}")'>📋 Copiar código</button>`;document.getElementById('modal').style.display='block';}function cerrarModal(){modal.style.display='none'}window.cerrarModal=cerrarModal;function render(){const ini=(pag-1)*por;const arr=fil.slice(ini,ini+por);productosHtml='';arr.forEach(p=>{productosHtml+=`<div class=card><span class=fav onclick='toggleFav("${p.PERSONALIZADO}")'>${esFav(p.PERSONALIZADO)?'⭐':'☆'}</span><div class=imgbox><img src='imagenes/${p.PERSONALIZADO}.jpg' onerror='this.style.display="none"'></div><h3>${p.DESCRIPCION}</h3><div>${p.PERSONALIZADO}</div><div>${p.MARCA}</div><b>${p.PRECIO}</b><br><button class=btn onclick='copiar("${p.PERSONALIZADO}")'>📋</button><button class=btn onclick='detalle(productos.find(x=>x.PERSONALIZADO=="${p.PERSONALIZADO}"))'>🔍</button></div>`});document.getElementById('productos').innerHTML=productosHtml;cnt.textContent=fil.length+' productos';pag.textContent='Página '+window.pag+' de '+Math.max(1,Math.ceil(fil.length/por));}window.toggleFav=toggleFav;window.copiar=copiar;window.detalle=detalle;buscar.oninput=filtro;soloFav.onchange=filtro;function filtro(){let t=buscar.value.toLowerCase();fil=productos.filter(p=>(p.DESCRIPCION.toLowerCase().includes(t)||p.PERSONALIZADO.includes(t))&& (soloFav.value==='no'||favs.includes(p.PERSONALIZADO)));pag=1;render()}prev.onclick=()=>{if(pag>1){pag--;render()}};next.onclick=()=>{if(pag<Math.ceil(fil.length/por)){pag++;render()}};</script></body></html>
