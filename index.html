<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CATÁLOGO UFINET</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#f5f7fa;
padding:20px;
}

h1{
text-align:center;
color:#003366;
margin-bottom:20px;
}

.filtros{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

input,select{
padding:12px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}

#buscar{
flex:1;
}

#productos{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.info{
padding:15px;
}

.tipo{
display:inline-block;
background:#003366;
color:white;
padding:4px 10px;
border-radius:6px;
font-size:12px;
margin-bottom:10px;
}

.precio{
color:green;
font-weight:bold;
font-size:22px;
margin-top:10px;
}

.codigo{
font-size:13px;
color:#666;
}

.marca{
color:#0078D4;
font-weight:bold;
margin:5px 0;
}

</style>
</head>

<body>

<h1>CATÁLOGO UFINET</h1>

<div class="filtros">

<input
id="buscar"
type="text"
placeholder="Buscar por código o descripción">

<select id="tipo">
<option value="">Todos</option>
<option value="Equipo">Equipo</option>
<option value="Material">Material</option>
</select>

<select id="marca">
<option value="">Todas las marcas</option>
</select>

</div>

<div id="productos"></div>

<script>

const URL_EQUIPO =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSPAO4ozS0SV5dVYgnXjFYc4PuglWsgdS9-L8OTkCpmNm0W3UI40pRurBxjeDB5rw/pub?gid=728943862&single=true&output=csv";

const URL_MATERIAL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSPAO4ozS0SV5dVYgnXjFYc4PuglWsgdS9-L8OTkCpmNm0W3UI40pRurBxjeDB5rw/pub?gid=1402193486&single=true&output=csv";

let productos = [];

async function cargarDatos(){

const equipo = await fetch(URL_EQUIPO)
.then(r=>r.text());

const material = await fetch(URL_MATERIAL)
.then(r=>r.text());

const datosEquipo =
Papa.parse(equipo,{
header:true
}).data;

const datosMaterial =
Papa.parse(material,{
header:true
}).data;

datosEquipo.forEach(p=>{
p.TIPO="Equipo";
});

datosMaterial.forEach(p=>{
p.TIPO="Material";
});

productos = [
...datosEquipo,
...datosMaterial
];

cargarMarcas();
mostrar(productos);

}

function cargarMarcas(){

const marcas = [...new Set(
productos
.map(p=>p.MARCA)
.filter(Boolean)
)].sort();

const select =
document.getElementById("marca");

marcas.forEach(m=>{

const op =
document.createElement("option");

op.value=m;
op.textContent=m;

select.appendChild(op);

});

}

function mostrar(data){

const cont =
document.getElementById("productos");

cont.innerHTML="";

data.forEach(p=>{

const imagen =
p.IMAGEN && p.IMAGEN.trim() !== ""
? p.IMAGEN
: "https://via.placeholder.com/400x250?text=Sin+Imagen";

cont.innerHTML += `

<div class="card">

<img src="${imagen}">

<div class="info">

<div class="tipo">
${p.TIPO}
</div>

<h3>${p.DESCRIPCION || ""}</h3>

<div class="codigo">
Código: ${p.PERSONALIZADO || ""}
</div>

<div class="marca">
${p.MARCA || ""}
</div>

<div class="precio">
$ ${p["PRECIO UNITARIO"] || ""}
</div>

</div>

</div>

`;

});

}

function filtrar(){

const texto =
document.getElementById("buscar")
.value
.toLowerCase();

const tipo =
document.getElementById("tipo")
.value;

const marca =
document.getElementById("marca")
.value;

const resultado =
productos.filter(p=>{

const desc =
(p.DESCRIPCION || "")
.toLowerCase();

const cod =
String(
p.PERSONALIZADO || ""
);

return(

(desc.includes(texto) ||
cod.includes(texto))

&&

(tipo==="" ||
p.TIPO===tipo)

&&

(marca==="" ||
p.MARCA===marca)

);

});

mostrar(resultado);

}

document
.getElementById("buscar")
.addEventListener("input",filtrar);

document
.getElementById("tipo")
.addEventListener("change",filtrar);

document
.getElementById("marca")
.addEventListener("change",filtrar);

cargarDatos();

</script>

</body>
</html>
